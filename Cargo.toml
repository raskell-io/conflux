[workspace]
members = [
    "crates/core",
    "crates/schema",
    "crates/store",
    "crates/git",
    "crates/api",
    "crates/cli",
    "crates/replication",
    "crates/tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Conflux Contributors"]
license = "Apache-2.0"
repository = "https://github.com/raskell-io/conflux"
homepage = "https://github.com/raskell-io/conflux"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "fs",
    "macros",
] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
kdl = "6.0"
quick-xml = { version = "0.37", features = ["serialize"] }
hcl-rs = "0.18"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# API
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
axum = "0.8"
tower = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Git
gix = "0.72"

# CRDT
crdts = "7.3"

# Clocks
uhlc = { version = "0.9", features = ["serde"] }

# Hashing and identity
uuid = { version = "1.20", features = ["v4", "serde"] }
sha2 = "0.10"

# Storage
rusqlite = { version = "0.33", features = ["bundled"] }

# Async storage backends (feature-gated in conflux-store)
# Note: sqlx is declared directly in conflux-store to avoid sqlite version conflicts
aws-sdk-dynamodb = "1.54"
aws-config = "1.6"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Testing
proptest = "1.6"
insta = "1.46"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
parking_lot = "0.12"
bytes = "1.9"
whoami = "1.5"
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true
